name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze_and_test:
    name: Lint, Format & Test
    runs-on: ubuntu-latest
    env:
      # Empty on forks and when the secret is not configured.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Create environment files
        # Per-environment secrets win when configured; shared secrets are the
        # fallback so existing setups keep working. ENABLE_ANALYTICS is set
        # explicitly per flavor (prod=true).
        run: |-
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_DEV || secrets.API_BASE_URL }}" > .env.dev
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}" >> .env.dev
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_DEV || secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env.dev
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY_DEV || secrets.GOOGLE_PLACES_API_KEY }}" >> .env.dev
          echo "ENABLE_ANALYTICS=false" >> .env.dev
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_STAGING || secrets.API_BASE_URL }}" > .env.staging
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_STAGING || secrets.SUPABASE_URL }}" >> .env.staging
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_STAGING || secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env.staging
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY_STAGING || secrets.GOOGLE_PLACES_API_KEY }}" >> .env.staging
          echo "ENABLE_ANALYTICS=false" >> .env.staging
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_PROD || secrets.API_BASE_URL }}" > .env.prod
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL }}" >> .env.prod
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_PROD || secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env.prod
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY_PROD || secrets.GOOGLE_PLACES_API_KEY }}" >> .env.prod
          echo "ENABLE_ANALYTICS=true" >> .env.prod

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (json_serializable & mocks)
        # *.g.dart and *.mocks.dart are gitignored, so a fresh checkout ships
        # none of them. Generate before analyze/test or the build fails on
        # missing part files and undefined _<$Foo>{From,To}Json methods.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Contract codegen matches the backend
        # Reruns tool/gen_enums.py and tool/api_fixtures.py and fails when
        # lib/app/data/models/wire_enums.dart or test/fixtures differ. It needs
        # a backend checkout and uv: set GHAR_BACKEND_DIR to the checkout and
        # pass --strict. With no checkout it prints a notice and skips.
        run: tool/check_contract.sh

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Lint (analyze)
        # Full gate: zero infos, warnings, and errors. build/** (generated
        # firebase examples) is excluded in analysis_options.yaml so only
        # first-party code is graded. Do not re-add --no-fatal-* flags.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Contract tests
        run: flutter test test/contract

      - name: Run tests
        # Plain 'flutter test' runs the Dart unit/widget suite in test/; no
        # --flavor (that is a build/integration flag, unnecessary for unit
        # tests and it triggers Gradle flavor resolution on headless runners).
        run: flutter test --coverage

      - name: Check for outdated dependencies (non-blocking report)
        run: flutter pub outdated --no-dev-dependencies || true

      - name: Coverage gate (60% line gate, non-blocking)
        # TODO(enforce): flip continue-on-error to false once baseline exceeds 60%
        if: always()
        continue-on-error: true
        run: |-
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info found; skipping coverage report."
            exit 0
          fi
          sf=$(grep -c '^SF:' coverage/lcov.info || true)
          lf=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' coverage/lcov.info)
          lh=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' coverage/lcov.info)
          if [ "$lf" -gt 0 ]; then
            covered_pct=$(awk "BEGIN{printf \"%.1f\", $lh*100/$lf}")
          else
            covered_pct="n/a"
          fi
          echo "Coverage summary: files=$sf lines_total=$lf lines_hit=$lh line_coverage=${covered_pct}%"
          echo "Per-directory coverage (watchlist):"
          for dir in lib/app/data/providers lib/features/auth lib/core/router; do
            lf_d=$(awk -v d="$dir" 'BEGIN{FS=":"; hit=0} /^SF:/{hit=index($0,d)>0} /^LF:/{if(hit) s+=$2} END{print s+0}' coverage/lcov.info)
            lh_d=$(awk -v d="$dir" 'BEGIN{FS=":"; hit=0} /^SF:/{hit=index($0,d)>0} /^LH:/{if(hit) s+=$2} END{print s+0}' coverage/lcov.info)
            if [ "$lf_d" -gt 0 ]; then
              pct_d=$(awk "BEGIN{printf \"%.1f\", $lh_d*100/$lf_d}")
              status_d="OK"
              if awk "BEGIN{exit !($pct_d < 60)}"; then status_d="BELOW 60%"; fi
              echo "  $dir: lines_total=$lf_d lines_hit=$lh_d line_coverage=${pct_d}% [$status_d]"
            else
              echo "  $dir: no files in coverage report"
            fi
          done
          if [ "$covered_pct" = "n/a" ]; then
            echo "Coverage gate: no lines found; skipping."
            exit 0
          fi
          if awk "BEGIN{exit !($covered_pct < 60)}"; then
            echo "Coverage gate FAILED: ${covered_pct}% < 60% (non-blocking this week; blocks after TODO(enforce) flip)."
            exit 1
          else
            echo "Coverage gate PASSED: ${covered_pct}% >= 60%."
          fi

      - name: Codecov token notice
        if: env.CODECOV_TOKEN == ''
        run: echo "::notice::CODECOV_TOKEN is not set; skipping the Codecov upload."

      - name: Upload coverage to Codecov
        # Strict upload, but only when a token and a coverage file exist: the
        # guards skip the step (green) instead of failing when the secret is
        # missing or `flutter test --coverage` produced nothing.
        if: always() && env.CODECOV_TOKEN != '' && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
