name: Android Main Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_android_main:
    name: Build Android APK (main, prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'
          cache: true

      - name: Create environment files
        # Per-environment secrets win when configured; shared secrets are the
        # fallback so existing setups keep working. ENABLE_ANALYTICS is set
        # explicitly per flavor (prod=true).
        run: |-
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_DEV || secrets.API_BASE_URL }}" > .env.dev
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV || secrets.SUPABASE_URL }}" >> .env.dev
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_DEV || secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env.dev
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY_DEV || secrets.GOOGLE_PLACES_API_KEY }}" >> .env.dev
          echo "ENABLE_ANALYTICS=false" >> .env.dev
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_STAGING || secrets.API_BASE_URL }}" > .env.staging
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_STAGING || secrets.SUPABASE_URL }}" >> .env.staging
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_STAGING || secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env.staging
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY_STAGING || secrets.GOOGLE_PLACES_API_KEY }}" >> .env.staging
          echo "ENABLE_ANALYTICS=false" >> .env.staging
          echo "API_BASE_URL=${{ secrets.API_BASE_URL_PROD || secrets.API_BASE_URL }}" > .env.prod
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL }}" >> .env.prod
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_PROD || secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env.prod
          echo "GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY_PROD || secrets.GOOGLE_PLACES_API_KEY }}" >> .env.prod
          echo "ENABLE_ANALYTICS=true" >> .env.prod

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        run: >-
          echo -e "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}\nkeyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}\nkeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}\nstoreFile=keystore.jks" > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (json_serializable & mocks)
        # *.g.dart are gitignored; generate before building or the app fails to
        # compile on missing part files.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (prod)
        # Compile-time dart-defines so the artifact never depends on bundled
        # .env files. Same per-env secret fallbacks as 'Create environment
        # files'; defines take precedence in AppConfig.
        run: |
          flutter build apk --release --flavor prod -t lib/main_prod.dart \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL_PROD || secrets.API_BASE_URL }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_PROD || secrets.SUPABASE_PUBLISHABLE_KEY }} \
            --dart-define=GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY_PROD || secrets.GOOGLE_PLACES_API_KEY }} \
            --dart-define=ENABLE_ANALYTICS=true \
            --dart-define=DEFAULT_COUNTRY=IN

      - name: Rename APK
        run: |
          set -euxo pipefail
          src="build/app/outputs/flutter-apk/app-prod-release.apk"
          dest="build/app/outputs/flutter-apk/360ghar-stays-prod.apk"
          if [ -f "$src" ]; then
            mv "$src" "$dest"
          else
            echo "APK not found at $src" >&2
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stays-app-main-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/360ghar-stays-prod.apk
          retention-days: 14
          if-no-files-found: error
