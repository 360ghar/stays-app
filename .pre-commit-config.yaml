# Local git hooks. Mirrors the CI gate in .github/workflows/ci.yml
# (dart format check + flutter analyze, error-only), plus the contract codegen
# check (needs a backend checkout, skips without one).
repos:
  - repo: local
    hooks:
      - id: dart-format
        name: dart format check
        entry: dart format --output=none --set-exit-if-changed .
        language: system
        pass_filenames: false
      - id: flutter-analyze
        name: flutter analyze (error-only, matches CI)
        entry: flutter analyze --no-fatal-infos --no-fatal-warnings
        language: system
        pass_filenames: false
      - id: contract-codegen
        name: contract codegen matches the backend
        entry: tool/check_contract.sh
        language: system
        pass_filenames: false
        always_run: true
